<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Drift · Sleep Sounds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='62' cy='50' r='34' fill='%23cdd6ff'/%3E%3Ccircle cx='48' cy='42' r='30' fill='%230b1026'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #060a1c 0%, #0b1026 45%, #141b3d 100%);
    color: #e9edff;
    min-height: 100vh;
    min-height: 100dvh;
    touch-action: manipulation;
    padding-bottom: 230px;
  }
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #ffffffcc, transparent),
      radial-gradient(1px 1px at 32% 8%, #ffffff99, transparent),
      radial-gradient(2px 2px at 58% 18%, #ffffffcc, transparent),
      radial-gradient(1px 1px at 74% 32%, #ffffff77, transparent),
      radial-gradient(1.5px 1.5px at 88% 12%, #ffffffaa, transparent),
      radial-gradient(1px 1px at 6% 48%, #ffffff77, transparent),
      radial-gradient(2px 2px at 24% 62%, #ffffff88, transparent),
      radial-gradient(1px 1px at 44% 42%, #ffffff66, transparent),
      radial-gradient(1.5px 1.5px at 66% 55%, #ffffff99, transparent),
      radial-gradient(1px 1px at 82% 68%, #ffffff77, transparent),
      radial-gradient(2px 2px at 94% 44%, #ffffff88, transparent),
      radial-gradient(1px 1px at 16% 82%, #ffffff66, transparent),
      radial-gradient(1.5px 1.5px at 38% 74%, #ffffff88, transparent),
      radial-gradient(1px 1px at 52% 90%, #ffffff66, transparent),
      radial-gradient(1.5px 1.5px at 70% 84%, #ffffff77, transparent);
  }
  .moon {
    position: fixed; top: 34px; right: 30px; width: 64px; height: 64px;
    border-radius: 50%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 35% 35%, #f4f6ff, #c9d2f7 60%, #a9b4e8);
    box-shadow: 0 0 40px 12px rgba(180, 195, 255, .25), 0 0 90px 30px rgba(150, 165, 255, .12);
  }
  header { position: relative; z-index: 1; text-align: center; padding: 56px 20px 10px; }
  header h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
  header p { margin: 8px 0 0; color: #a9b3d9; font-size: 14px; }
  .grid {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
    padding: 20px 16px 8px; max-width: 560px; margin: 0 auto;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 20px 10px 16px;
    text-align: center; cursor: pointer; user-select: none;
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .card:active { transform: scale(.96); }
  .card .emoji { font-size: 36px; line-height: 1; display: block; margin-bottom: 10px; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .desc { font-size: 11.5px; color: #a9b3d9; margin-top: 4px; }
  .card.playing {
    border-color: rgba(139, 156, 240, .8);
    background: rgba(139, 156, 240, .12);
    box-shadow: 0 0 24px rgba(139, 156, 240, .25), inset 0 0 20px rgba(139, 156, 240, .08);
  }
  .eq { display: none; justify-content: center; gap: 3px; margin-top: 10px; height: 14px; align-items: flex-end; }
  .card.playing .eq { display: flex; }
  .eq span { width: 3px; background: #8b9cf0; border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .eq span:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq span:nth-child(2) { height: 100%; animation-delay: .2s; }
  .eq span:nth-child(3) { height: 40%; animation-delay: .4s; }
  .eq span:nth-child(4) { height: 80%; animation-delay: .1s; }
  @keyframes eq { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  .tip { position: relative; z-index: 1; text-align: center; color: #8b95c2; font-size: 12.5px; padding: 6px 30px 0; max-width: 560px; margin: 0 auto; }
  .card.loading { animation: cardpulse 1s ease-in-out infinite; }
  @keyframes cardpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .credit { position: relative; z-index: 1; text-align: center; color: #5b648f; font-size: 11px; padding: 14px 30px 0; max-width: 560px; margin: 0 auto; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    background: rgba(10, 14, 34, .72);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border-top: 1px solid rgba(255,255,255,.1);
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    max-height: 46vh; overflow-y: auto;
  }
  .dock-inner { max-width: 560px; margin: 0 auto; }
  .dock-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dock-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #8b95c2; font-weight: 600; }
  .mix-name { font-size: 13px; width: 118px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stopall {
    margin-left: auto; background: rgba(255,255,255,.08); color: #e9edff;
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    padding: 6px 14px; font-size: 12.5px; cursor: pointer;
  }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); outline: none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: #8b9cf0; box-shadow: 0 0 10px rgba(139,156,240,.6); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: none; border-radius: 50%; background: #8b9cf0; cursor: pointer; }
  .timer-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #cfd6f5;
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .chip.on { background: rgba(139,156,240,.25); border-color: #8b9cf0; color: #fff; }
  .countdown { font-size: 13px; color: #8b9cf0; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .empty-mix { font-size: 13px; color: #8b95c2; text-align: center; padding: 6px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="moon"></div>

<header>
  <h1>Drift</h1>
  <p>Tap sounds to layer your perfect night. They play forever.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="tip">Tip: layer a few together &mdash; rain + fireplace is elite. Set a timer and drift off.</p>
  <p class="credit">Field recordings via Wikimedia Commons contributors (CC BY / CC BY-SA)</p>
</main>

<div class="dock" id="dock">
  <div class="dock-inner">
    <div class="dock-row">
      <span class="dock-label">Now playing</span>
      <button class="stopall hidden" id="stopAll">Stop all</button>
    </div>
    <div id="mixer"><div class="empty-mix">Nothing playing yet &mdash; pick a sound above.</div></div>
    <div class="dock-row" style="margin-top:10px">
      <span class="dock-label">Volume</span>
      <input type="range" id="masterVol" min="0" max="100" value="80">
    </div>
    <div class="dock-row">
      <span class="dock-label">Sleep timer</span>
      <div class="timer-chips" id="timerChips"></div>
      <span class="countdown hidden" id="countdown"></span>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ Drift · sleep sounds ============
   Rain beds are real HD recordings (Wikimedia Commons), looped
   seamlessly with a baked-in crossfade. Everything else is
   synthesized live with the Web Audio API. */

const SOUNDS = [
  { id:"rain",     emoji:"\u{1F327}", name:"Gentle Rain",    desc:"soft rainfall" },
  { id:"storm",    emoji:"\u26C8",   name:"Rain & Thunder", desc:"rain with distant thunder" },
  { id:"tinroof",  emoji:"\u{1F3E0}", name:"Tin Roof Rain",  desc:"rain on a metal roof" },
  { id:"ocean",    emoji:"\u{1F30A}", name:"Ocean Waves",    desc:"slow rolling surf" },
  { id:"white",    emoji:"\u{1F32B}", name:"White Noise",    desc:"steady shhh" },
  { id:"brown",    emoji:"\u{1F314}", name:"Brown Noise",    desc:"deep low rumble" },
  { id:"fan",      emoji:"\u{1F300}", name:"Fan",            desc:"bedroom fan hum" },
  { id:"fire",     emoji:"\u{1F525}", name:"Fireplace",      desc:"crackling fire" },
  { id:"crickets", emoji:"\u{1F997}", name:"Night Crickets", desc:"summer night" },
];

let AC = null, master = null;
const active = new Map();           // id -> handle
const pendingLoads = new Map();     // id -> { cancelled }
const bufCache = {};
const state = { masterVol: 0.8, vols: {}, timerMin: 0 };

/* ---------- recorded rain files (HD, seamless crossfade loops) ---------- */
const FILE_URLS = {
  rain: "sounds/rain-gentle.mp3",
  tinroof: "sounds/rain-tinroof.mp3",
  fire: "sounds/fire-bonfire.mp3",
};
const THUNDER_URLS = [
  "sounds/thunder-1.mp3",
  "sounds/thunder-2.mp3",
  "sounds/thunder-3.mp3",
  "sounds/thunder-4.mp3",
];
function preloadThunder() {
  if (!AC) return;
  THUNDER_URLS.forEach(u => loadFileBuf(u).catch(() => {}));
}
/* Real recorded thunder: random clap, random distance feel + stereo position */
async function thunderClapReal(h) {
  const url = THUNDER_URLS[(Math.random() * THUNDER_URLS.length) | 0];
  try {
    const buf = await loadFileBuf(url);
    if (h.dead) return;
    const src = AC.createBufferSource(); src.buffer = buf;
    const g = AC.createGain();
    g.gain.value = 0.45 + Math.random() * 0.55;
    src.connect(g);
    let tail = g;
    if (AC.createStereoPanner) {
      const pan = AC.createStereoPanner();
      pan.pan.value = Math.random() * 1.6 - 0.8;
      g.connect(pan); tail = pan;
    }
    tail.connect(h.out);
    const t = AC.currentTime + 0.05;
    src.start(t); src.stop(t + buf.duration + 0.1);
    h.blip(src);
  } catch (e) { if (!h.dead) thunderClap(h); }
}
const fileBufCache = {};
function preloadRainFiles() {
  if (!AC) return;
  Object.values(FILE_URLS).forEach(u => loadFileBuf(u).catch(() => {}));
}
async function loadFileBuf(url) {
  if (fileBufCache[url]) return fileBufCache[url];
  const p = (async () => {
    const res = await fetch(url, { cache: "force-cache" });
    if (!res.ok) throw new Error("http " + res.status);
    return AC.decodeAudioData(await res.arrayBuffer());
  })();
  fileBufCache[url] = p;
  try { return await p; }
  catch (e) { delete fileBufCache[url]; throw e; }
}
/* Bake a crossfade of the tail into the head so buffer.loop is seamless
   with zero timers (immune to mobile background throttling). */
function xfadeLoopBuffer(buf, xfadeSecs) {
  const sr = buf.sampleRate;
  const xlen = Math.min(Math.floor(sr * xfadeSecs), Math.floor(buf.length / 4));
  const out = AC.createBuffer(buf.numberOfChannels, buf.length, sr);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const src = buf.getChannelData(ch), dst = out.getChannelData(ch);
    dst.set(src);
    const start = buf.length - xlen;
    for (let i = 0; i < xlen; i++) {
      const t = i / xlen;
      dst[start + i] = src[start + i] * (1 - t) + src[i] * t;
    }
  }
  return out;
}
async function fileLoop(h, url, level) {
  const buf = await loadFileBuf(url);
  if (h.dead) return;
  const src = AC.createBufferSource();
  src.buffer = xfadeLoopBuffer(buf, 4);
  src.loop = true;
  const g = AC.createGain(); g.gain.value = level;
  src.connect(g); g.connect(h.out);
  src.start();
  h.nodes.push(src);
}

/* ---------- audio helpers ---------- */
function ensureCtx() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = state.masterVol;
    master.connect(AC.destination);
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Drift · Sleep Sounds", artist: "Drift", album: "Sleep Mix"
        });
        navigator.mediaSession.setActionHandler("pause", () => stopAll());
      } catch (e) {}
    }
  }
  if (AC.state === "suspended") AC.resume();
  preloadRainFiles();
  preloadThunder();
}

function noiseBuf(type, secs) {
  const key = type + ":" + secs;
  if (bufCache[key]) return bufCache[key];
  const len = Math.max(1, Math.floor(AC.sampleRate * secs));
  const b = AC.createBuffer(1, len, AC.sampleRate);
  const d = b.getChannelData(0);
  if (type === "white") {
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } else if (type === "pink") {
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520; b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522; b5 = -0.7616*b5 - w*0.0168980;
      d[i] = (b0+b1+b2+b3+b4+b5+b6 + w*0.5362) * 0.11; b6 = w*0.115926;
    }
  } else { // brown
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.5;
    }
  }
  bufCache[key] = b;
  return b;
}

function loopSrc(type, secs) {
  const s = AC.createBufferSource();
  s.buffer = noiseBuf(type, secs || 8);
  s.loop = true;
  return s;
}
function filt(type, freq, q) {
  const f = AC.createBiquadFilter();
  f.type = type; f.frequency.value = freq;
  if (q) f.Q.value = q;
  return f;
}
function lfo(rate, depth) {
  const o = AC.createOscillator(); o.frequency.value = rate;
  const g = AC.createGain(); g.gain.value = depth;
  o.connect(g); o.start();
  return { osc: o, out: g };
}
/* repeat fn() every random min..max ms until handle dies */
function repeat(h, fn, minMs, maxMs) {
  (function tick() {
    if (h.dead) return;
    fn();
    h.timers.push(setTimeout(tick, minMs + Math.random() * (maxMs - minMs)));
  })();
}

function baseHandle() {
  const out = AC.createGain(); out.gain.value = 1; out.connect(master);
  const h = {
    out, dead: false, nodes: [], timers: [], oneshots: new Set(),
    blip(n) { h.oneshots.add(n); n.onended = () => h.oneshots.delete(n); },
    stop() {
      h.dead = true;
      h.timers.forEach(clearTimeout);
      h.oneshots.forEach(n => { try { n.stop(); } catch (e) {} });
      h.oneshots.clear();
      h.nodes.forEach(n => { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
      try { out.disconnect(); } catch (e) {}
    },
    setVol(v) { out.gain.setTargetAtTime(v, AC.currentTime, 0.15); }
  };
  return h;
}

/* ---------- sound builders ---------- */
function rainBed(h, level, droplets) {
  const src = loopSrc("white", 8); h.nodes.push(src);
  const hp = filt("highpass", 350), lp = filt("lowpass", 2600);
  const g = AC.createGain(); g.gain.value = level;
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(h.out);
  const l = lfo(0.35, level * 0.25); l.out.connect(g.gain); h.nodes.push(l.osc);
  src.start();
  if (droplets) repeat(h, () => {
    const p = AC.createBufferSource(); p.buffer = noiseBuf("white", 0.09);
    const bp = filt("bandpass", 2800 + Math.random() * 3200, 9);
    const e = AC.createGain(); const t = AC.currentTime;
    const v = 0.02 + Math.random() * 0.06;
    e.gain.setValueAtTime(0.0001, t);
    e.gain.exponentialRampToValueAtTime(v, t + 0.008);
    e.gain.exponentialRampToValueAtTime(0.0008, t + 0.07);
    p.connect(bp); bp.connect(e); e.connect(h.out);
    p.start(t); p.stop(t + 0.12); h.blip(p);
  }, 90, 420);
}

function thunderClap(h) {
  const dist = Math.random();                       // 0 = near, 1 = far
  const c = AC.createBufferSource(); c.buffer = noiseBuf("white", 0.6);
  const chp = filt("highpass", 700);
  const ce = AC.createGain(); const t0 = AC.currentTime + 0.05;
  const cv = Math.max((0.22 + Math.random() * 0.38) * (1 - dist * 0.6), 0.001);
  ce.gain.setValueAtTime(0.0001, t0);
  ce.gain.exponentialRampToValueAtTime(cv, t0 + 0.02);
  ce.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.25 + Math.random() * 0.35);
  c.connect(chp); chp.connect(ce); ce.connect(h.out);
  c.start(t0); c.stop(t0 + 1); h.blip(c);
  h.timers.push(setTimeout(() => {
    if (h.dead) return;
    const r = AC.createBufferSource(); r.buffer = noiseBuf("brown", 10);
    const rlp = filt("lowpass", 110);
    const re = AC.createGain(); const t1 = AC.currentTime;
    const dur = 3.5 + Math.random() * 5;
    const rv = Math.max((0.45 + Math.random() * 0.4) * (1 - dist * 0.5), 0.001);
    re.gain.setValueAtTime(0.0001, t1);
    re.gain.exponentialRampToValueAtTime(rv, t1 + 0.25);
    re.gain.exponentialRampToValueAtTime(0.0008, t1 + dur);
    r.connect(rlp); rlp.connect(re); re.connect(h.out);
    r.start(t1); r.stop(t1 + dur + 0.2); h.blip(r);
  }, (0.3 + dist * 2.2) * 1000));
}

/* legacy procedural tin roof — fallback if the recording can't load */
function tinroofLegacy(h) {
  const src = loopSrc("white", 8); h.nodes.push(src);
  const hp = filt("highpass", 1100), bp = filt("bandpass", 3600, 0.9);
  const g = AC.createGain(); g.gain.value = 0.4;
  src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(h.out);
  const l = lfo(0.8, 0.12); l.out.connect(g.gain); h.nodes.push(l.osc);
  src.start();
  repeat(h, () => {  // metallic pings
    const o = AC.createOscillator(); o.type = "triangle";
    o.frequency.value = 1700 + Math.random() * 3800;
    const e = AC.createGain(); const t = AC.currentTime;
    const v = 0.015 + Math.random() * 0.05, dur = 0.1 + Math.random() * 0.18;
    e.gain.setValueAtTime(v, t);
    e.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(e); e.connect(h.out); o.start(t); o.stop(t + dur + 0.05); h.blip(o);
  }, 140, 650);
  repeat(h, () => {  // low resonant patter
    const o = AC.createOscillator(); o.type = "sine";
    o.frequency.value = 380 + Math.random() * 320;
    const e = AC.createGain(); const t = AC.currentTime;
    const v = 0.02 + Math.random() * 0.04;
    e.gain.setValueAtTime(v, t);
    e.gain.exponentialRampToValueAtTime(0.0008, t + 0.4);
    o.connect(e); e.connect(h.out); o.start(t); o.stop(t + 0.5); h.blip(o);
  }, 1200, 4000);
}

/* legacy procedural fire — fallback if the recording can't load */
function fireLegacy(h) {
  const src = loopSrc("brown", 8); h.nodes.push(src);
  const lp = filt("lowpass", 220);
  const g = AC.createGain(); g.gain.value = 0.5;
  src.connect(lp); lp.connect(g); g.connect(h.out);
  const l = lfo(0.11, 0.08); l.out.connect(g.gain); h.nodes.push(l.osc);
  src.start();
  repeat(h, () => {  // crackles
    if (Math.random() < 0.1) {  // occasional deep pop
      const o = AC.createOscillator(); o.type = "sine";
      o.frequency.value = 150 + Math.random() * 150;
      const e = AC.createGain(); const t = AC.currentTime;
      const v = 0.06 + Math.random() * 0.08;
      e.gain.setValueAtTime(v, t);
      e.gain.exponentialRampToValueAtTime(0.0008, t + 0.12);
      o.connect(e); e.connect(h.out); o.start(t); o.stop(t + 0.2); h.blip(o);
      return;
    }
    const p = AC.createBufferSource(); p.buffer = noiseBuf("white", 0.08);
    const bp = filt("bandpass", 1300 + Math.random() * 2400, 7);
    const e = AC.createGain(); const t = AC.currentTime;
    const v = 0.03 + Math.random() * 0.13;
    e.gain.setValueAtTime(0.0001, t);
    e.gain.exponentialRampToValueAtTime(v, t + 0.005);
    e.gain.exponentialRampToValueAtTime(0.0008, t + 0.03 + Math.random() * 0.06);
    p.connect(bp); bp.connect(e); e.connect(h.out);
    p.start(t); p.stop(t + 0.15); h.blip(p);
  }, 60, 700);
}

const BUILDERS = {
  async rain(h) {
    try { await fileLoop(h, FILE_URLS.rain, 1.0); }
    catch (e) { if (!h.dead) rainBed(h, 0.5, true); }
  },

  async storm(h) {
    try { await fileLoop(h, FILE_URLS.rain, 0.85); }
    catch (e) { if (!h.dead) rainBed(h, 0.34, true); }
    if (h.dead) return;
    const w = loopSrc("brown", 8); h.nodes.push(w);
    const wlp = filt("lowpass", 240);
    const wg = AC.createGain(); wg.gain.value = 0.32;
    w.connect(wlp); wlp.connect(wg); wg.connect(h.out);
    const l = lfo(0.08, 0.2); l.out.connect(wg.gain); h.nodes.push(l.osc);
    w.start();
    h.timers.push(setTimeout(() => { if (!h.dead) thunderClapReal(h); }, 2500));
    repeat(h, () => thunderClapReal(h), 9000, 32000);
  },

  async tinroof(h) {
    try { await fileLoop(h, FILE_URLS.tinroof, 0.9); }
    catch (e) { if (!h.dead) tinroofLegacy(h); }
  },

  ocean(h) {
    const src = loopSrc("brown", 10); h.nodes.push(src);
    const lp = filt("lowpass", 480);
    const swell = AC.createGain(); swell.gain.value = 0.55;
    src.connect(lp); lp.connect(swell); swell.connect(h.out);
    const l = lfo(0.07, 0.36); l.out.connect(swell.gain); h.nodes.push(l.osc);
    src.start();
    const f = loopSrc("white", 6); h.nodes.push(f);
    const bp = filt("bandpass", 750, 0.6);
    const fg = AC.createGain(); fg.gain.value = 0.05;
    f.connect(bp); bp.connect(fg); fg.connect(h.out);
    const l2 = lfo(0.07, 0.04); l2.out.connect(fg.gain); h.nodes.push(l2.osc);
    f.start();
  },

  white(h) {
    const src = loopSrc("white", 8); h.nodes.push(src);
    const g = AC.createGain(); g.gain.value = 0.28;
    src.connect(g); g.connect(h.out); src.start();
  },

  brown(h) {
    const src = loopSrc("brown", 8); h.nodes.push(src);
    const g = AC.createGain(); g.gain.value = 0.42;
    src.connect(g); g.connect(h.out); src.start();
  },

  fan(h) {
    const src = loopSrc("pink", 8); h.nodes.push(src);
    const lp = filt("lowpass", 420);
    const g = AC.createGain(); g.gain.value = 0.55;
    src.connect(lp); lp.connect(g); g.connect(h.out);
    const blade = lfo(2.8, 0.05); blade.out.connect(g.gain); h.nodes.push(blade.osc);
    const wander = lfo(0.05, 0.04); wander.out.connect(g.gain); h.nodes.push(wander.osc);
    src.start();
  },

  async fire(h) {
    try { await fileLoop(h, FILE_URLS.fire, 0.9); }
    catch (e) { if (!h.dead) fireLegacy(h); }
  },

  crickets(h) {
    const air = loopSrc("white", 8); h.nodes.push(air);
    const alp = filt("lowpass", 280);
    const ag = AC.createGain(); ag.gain.value = 0.09;
    air.connect(alp); alp.connect(ag); ag.connect(h.out);
    const al = lfo(0.06, 0.03); al.out.connect(ag.gain); h.nodes.push(al.osc);
    air.start();
    [4150, 4450, 4780].forEach((fq, i) => {
      const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = fq;
      const cg = AC.createGain(); cg.gain.value = 0.0001;
      o.connect(cg); cg.connect(h.out); o.start();
      h.nodes.push(o);
      const chirp = () => {
        if (h.dead) return;
        const t0 = AC.currentTime + 0.02;
        const pulses = 4 + Math.floor(Math.random() * 4);
        const v = 0.03 + Math.random() * 0.035;
        for (let k = 0; k < pulses; k++) {
          const t = t0 + k * 0.07;
          cg.gain.setValueAtTime(0.0001, t);
          cg.gain.exponentialRampToValueAtTime(v, t + 0.015);
          cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
        }
      };
      h.timers.push(setTimeout(chirp, 400 + i * 700));
      repeat(h, chirp, 700, 2200);
    });
  },
};

/* ---------- transport ---------- */
async function toggleSound(id) {
  ensureCtx();
  const h = active.get(id);
  if (h) { h.stop(); active.delete(id); render(); return; }
  if (pendingLoads.has(id)) {           // tapped while loading: cancel it
    pendingLoads.get(id).cancelled = true;
    pendingLoads.delete(id);
    render();
    return;
  }
  const load = { cancelled: false };
  pendingLoads.set(id, load);
  render();
  const nh = baseHandle();
  try { await BUILDERS[id](nh); } catch (e) {}
  pendingLoads.delete(id);
  if (load.cancelled || nh.dead) { nh.stop(); render(); return; }
  nh.setVol(state.vols[id] !== undefined ? state.vols[id] : 0.8);
  active.set(id, nh);
  render();
}

function stopAll() {
  pendingLoads.forEach(l => { l.cancelled = true; });
  pendingLoads.clear();
  active.forEach(h => h.stop());
  active.clear();
  clearTimeout(timerId); clearInterval(timerInt);
  state.timerMin = 0;
  const cd = document.getElementById("countdown");
  cd.classList.add("hidden"); cd.textContent = "";
  render();
}

let timerId = null, timerInt = null, timerEnd = 0;
function setTimer(min) {
  clearTimeout(timerId); clearInterval(timerInt);
  state.timerMin = min;
  const cd = document.getElementById("countdown");
  if (min > 0 && AC) {
    timerEnd = Date.now() + min * 60000;
    const upd = () => {
      const left = Math.max(0, timerEnd - Date.now());
      const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      cd.textContent = m + ":" + String(s).padStart(2, "0") + " left";
      cd.classList.remove("hidden");
    };
    upd(); timerInt = setInterval(upd, 1000);
    timerId = setTimeout(() => {
      const t = AC.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(0.0001, t + 20);
      setTimeout(() => { stopAll(); if (master) master.gain.value = state.masterVol; }, 20500);
    }, min * 60000);
  } else { cd.classList.add("hidden"); cd.textContent = ""; }
  render();
}

/* ---------- UI ---------- */
const grid = document.getElementById("grid");
const mixer = document.getElementById("mixer");
const stopAllBtn = document.getElementById("stopAll");
const masterSlider = document.getElementById("masterVol");
const chipsBox = document.getElementById("timerChips");
const TIMER_OPTS = [0, 15, 30, 60, 90];

SOUNDS.forEach(s => {
  const el = document.createElement("div");
  el.className = "card"; el.id = "card-" + s.id;
  el.innerHTML =
    '<span class="emoji">' + s.emoji + "</span>" +
    '<div class="name">' + s.name + "</div>" +
    '<div class="desc">' + s.desc + "</div>" +
    '<div class="eq"><span></span><span></span><span></span><span></span></div>';
  el.addEventListener("click", () => toggleSound(s.id));
  grid.appendChild(el);
});

TIMER_OPTS.forEach(m => {
  const c = document.createElement("button");
  c.className = "chip"; c.dataset.min = m;
  c.textContent = m === 0 ? "Off" : m + " min";
  c.addEventListener("click", () => { ensureCtx(); setTimer(m); });
  chipsBox.appendChild(c);
});

masterSlider.addEventListener("input", () => {
  state.masterVol = masterSlider.value / 100;
  if (master) master.gain.setTargetAtTime(state.masterVol, AC.currentTime, 0.05);
});
stopAllBtn.addEventListener("click", stopAll);

function render() {
  SOUNDS.forEach(s => {
    const card = document.getElementById("card-" + s.id);
    card.classList.toggle("playing", active.has(s.id));
    card.classList.toggle("loading", pendingLoads.has(s.id));
  });
  stopAllBtn.classList.toggle("hidden", active.size === 0);
  mixer.innerHTML = "";
  if (active.size === 0) {
    mixer.innerHTML = '<div class="empty-mix">Nothing playing yet &mdash; pick a sound above.</div>';
  } else {
    active.forEach((h, id) => {
      const s = SOUNDS.find(x => x.id === id);
      const row = document.createElement("div");
      row.className = "dock-row";
      const lab = document.createElement("span");
      lab.className = "mix-name"; lab.textContent = s.emoji + " " + s.name;
      const sl = document.createElement("input");
      sl.type = "range"; sl.min = 0; sl.max = 100;
      sl.value = Math.round((state.vols[id] !== undefined ? state.vols[id] : 0.8) * 100);
      sl.addEventListener("input", () => {
        state.vols[id] = sl.value / 100;
        const hh = active.get(id);
        if (hh) hh.setVol(state.vols[id]);
      });
      row.appendChild(lab); row.appendChild(sl);
      mixer.appendChild(row);
    });
  }
  chipsBox.querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("on", parseInt(c.dataset.min, 10) === state.timerMin);
  });
}
render();
</script>
